name: 👷Flow

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:
  merge_group:
 
jobs:
  # lint:
  #   uses: mraniki/coding_toolset/.github/workflows/🦺Lint.yml@main
  #   secrets: inherit

  lint_direct:
    name: 🦺 Lint Direct
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 🪵 Debug Checkout
        run: |
          echo "Running in: $(pwd)"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Listing files:"
          ls -la
          echo "Git log:"
          git log -n 5

      - name: 🐍 Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 🛠️ Install dependencies
        run: |
          pip install ruff
          # pip install pre-commit # Add if needed

      - name: 🚨 Lint
        run: |
          ruff check --fix .

  test:
    # needs: [lint]
    needs: [lint_direct]
    uses: mraniki/coding_toolset/.github/workflows/🧪Test.yml@main
    secrets: inherit
  build:
    # needs: [lint]
    needs: [lint_direct]
    uses: mraniki/coding_toolset/.github/workflows/🐍Build.yml@main
    secrets: inherit
  release:
    needs: [build, test]
    uses: mraniki/coding_toolset/.github/workflows/📦Release.yml@main
    secrets: inherit

